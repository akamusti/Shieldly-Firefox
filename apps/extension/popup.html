<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Privacy Shield</title>
  <style>
    :root {
      --bg: #0b0f16;
      --panel: #101722;
      --panel-2: #151f2d;
      --border: #223043;
      --text: #e7edf5;
      --muted: #8b9bb0;
      --accent: #2dd4bf;
      --accent-strong: #14b8a6;
      --accent-soft: rgba(45, 212, 191, 0.14);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 348px;
      padding: 0 14px 12px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 320px at 50% -180px, rgba(45, 212, 191, 0.20), transparent 65%),
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 10px;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(155deg, rgba(45, 212, 191, 0.22), rgba(45, 212, 191, 0.06));
      border: 1px solid rgba(45, 212, 191, 0.28);
      color: var(--accent);
    }
    .brand-mark svg { width: 17px; height: 17px; }
    .brand-name { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }
    .brand-sub { font-size: 10.5px; color: var(--muted); }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .icon-btn:hover { color: var(--text); border-color: #2f4257; background: var(--panel-2); }
    .icon-btn svg { width: 16px; height: 16px; }

    .hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel);
    }
    .power {
      position: relative;
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      flex: 0 0 auto;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      transition: transform 120ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
    }
    .power:hover { transform: translateY(-1px); }
    .power:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .power svg { width: 28px; height: 28px; }
    .power[data-on="true"] {
      border-color: transparent;
      background: linear-gradient(160deg, #3ee6d0, var(--accent-strong));
      color: #04231f;
      box-shadow: 0 10px 26px rgba(45, 212, 191, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .power[data-on="false"] {
      background: var(--danger-soft);
      border-color: rgba(248, 113, 113, 0.35);
      color: var(--danger);
    }
    .power[data-on="false"] .power-slash { display: block; }
    .power-slash {
      display: none;
      position: absolute;
      width: 40px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transform: rotate(-45deg);
      opacity: 0.6;
    }
    .hero-info { min-width: 0; }
    .site {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      word-break: break-all;
      line-height: 1.25;
    }
    .site-state { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
    .site-state.on { color: var(--accent); }
    .site-state.off { color: var(--danger); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .stat {
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      text-align: center;
    }
    .stat-value { display: block; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
    .stat-label { display: block; margin-top: 2px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .panel {
      margin-top: 10px;
      padding: 4px 12px 6px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 6px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .panel-note { font-size: 10px; letter-spacing: 0; text-transform: none; color: #6f8097; }
    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid rgba(34, 48, 67, 0.7);
    }
    .setting-label { font-size: 13px; }
    .setting-hint { margin-top: 2px; font-size: 10.5px; color: var(--muted); }

    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #1b2636;
      transition: background 150ms ease, border-color 150ms ease;
    }
    .switch .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #7d8da3;
      transition: transform 150ms ease, background 150ms ease;
    }
    .switch[aria-checked="true"] {
      background: var(--accent-soft);
      border-color: rgba(45, 212, 191, 0.45);
    }
    .switch[aria-checked="true"] .knob {
      transform: translateX(16px);
      background: var(--accent);
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.5);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 8px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      font-size: 12px;
      color: #cfdaea;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .action:hover { background: var(--panel-2); border-color: #2f4257; }
    .action svg { width: 14px; height: 14px; color: var(--muted); }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(34, 48, 67, 0.8);
    }
    .footer-label { font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 5 6v5.4c0 4.6 2.9 8 7 9.6 4.1-1.6 7-5 7-9.6V6l-7-3Z" />
          <path d="m9 12 2 2 4-4.5" />
        </svg>
      </span>
      <div>
        <div class="brand-name">Privacy Shield</div>
        <div class="brand-sub" id="version">v—</div>
      </div>
    </div>
    <button class="icon-btn" id="openOptions" title="Advanced settings" aria-label="Advanced settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h9" /><path d="M17 7h3" />
        <path d="M4 17h3" /><path d="M11 17h9" />
        <circle cx="15" cy="7" r="2.4" /><circle cx="8" cy="17" r="2.4" />
      </svg>
    </button>
  </header>

  <section class="hero">
    <button class="power" id="siteToggle" data-on="true" aria-pressed="true" title="Toggle protection for this site">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 5 6v5.4c0 4.6 2.9 8 7 9.6 4.1-1.6 7-5 7-9.6V6l-7-3Z" />
        <path d="m9 12 2 2 4-4.5" />
      </svg>
      <span class="power-slash" aria-hidden="true"></span>
    </button>
    <div class="hero-info">
      <div class="site" id="site">—</div>
      <div class="site-state" id="siteState">Checking…</div>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <span class="stat-value" id="siteBlocked">0</span>
      <span class="stat-label">Here</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="totalBlocked">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="rules">0</span>
      <span class="stat-label">Rules</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span>Site controls</span>
      <span class="panel-note" id="overrideNote"></span>
    </div>
    <div class="setting">
      <div>
        <div class="setting-label">Cookies</div>
        <div class="setting-hint" id="cookiesHint">Default</div>
      </div>
      <button class="switch" id="siteCookies" role="switch" aria-checked="true" aria-label="Block third-party cookies on this site">
        <span class="knob"></span>
      </button>
    </div>
    <div class="setting">
      <div>
        <div class="setting-label">Scripts</div>
        <div class="setting-hint" id="scriptsHint">Default</div>
      </div>
      <button class="switch" id="siteScripts" role="switch" aria-checked="false" aria-label="Block third-party scripts on this site">
        <span class="knob"></span>
      </button>
    </div>
    <div class="setting">
      <div>
        <div class="setting-label">Hide ads</div>
        <div class="setting-hint" id="cosmeticHint">Default</div>
      </div>
      <button class="switch" id="siteCosmetic" role="switch" aria-checked="true" aria-label="Hide ads on this site">
        <span class="knob"></span>
      </button>
    </div>
  </section>

  <div class="actions">
    <button class="action" id="picker">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="7" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
      Pick element
    </button>
    <button class="action" id="openLog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M5 7h14M5 12h14M5 17h9" />
      </svg>
      Request log
    </button>
  </div>

  <footer class="footer">
    <span class="footer-label">Global protection</span>
    <button class="switch" id="toggle" role="switch" aria-checked="true" aria-label="Toggle global protection">
      <span class="knob"></span>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
