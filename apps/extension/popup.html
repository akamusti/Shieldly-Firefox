<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Privacy Shield</title>
  <style>
    body { width: 300px; margin: 0; padding: 12px; font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6; }
    .header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0; }
    h2 { font-size: 13px; font-weight: 600; margin: 16px 0 2px; color: #7dd3fc; }
    label { display: flex; gap: 8px; align-items: center; margin: 7px 0; font-size: 13.5px; cursor: pointer; }
    label:has(input:disabled) { cursor: default; opacity: 0.6; }
    input[type="checkbox"] { margin: 0; }
    button { background: #2a2f3a; color: #e6e6e6; border: 1px solid #3a4050; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
    button:hover:not(:disabled) { background: #343b48; }
    button:disabled { cursor: default; opacity: 0.5; }
    .muted { color: #9aa0a6; font-size: 11.5px; }
    .site { font-size: 13px; color: #7dd3fc; word-break: break-all; }
    .site-state { font-size: 12px; color: #9aa0a6; margin-top: 2px; }
    .site-state.active { color: #7dd3fc; }
    .stats { display: grid; gap: 3px; margin-top: 8px; font-size: 12.5px; color: #9aa0a6; }
    .stats .value { color: #e6e6e6; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .link { display: inline-block; margin-top: 10px; color: #7dd3fc; font-size: 12.5px; text-decoration: none; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Privacy Shield</h1>
    <span class="muted" id="version">v—</span>
  </div>

  <h2>Current site</h2>
  <div class="site" id="site">—</div>
  <div class="site-state" id="siteState">Checking…</div>

  <div class="stats">
    <div>Blocked here: <span class="value" id="siteBlocked">0</span></div>
    <div>Total blocked: <span class="value" id="totalBlocked">0</span></div>
    <div>Active rules: <span class="value" id="rules">0</span></div>
  </div>

  <h2>Site controls</h2>
  <label><input type="checkbox" id="siteEnabled" /> Protection on this site</label>
  <label><input type="checkbox" id="siteCookies" /> Block cookies</label>
  <label><input type="checkbox" id="siteScripts" /> Block scripts</label>
  <label><input type="checkbox" id="siteCosmetic" /> Hide ads</label>

  <div class="actions">
    <button id="picker">Pick element</button>
    <button id="openLog">Request log</button>
  </div>
  <a class="link" href="#" id="openOptions">Advanced settings</a>

  <h2>Global</h2>
  <label><input type="checkbox" id="toggle" /> Global protection</label>

  <script src="popup.js"></script>
</body>
</html>
