<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Privacy Shield — Advanced</title>
  <style>
    body { max-width: 720px; margin: 24px auto; padding: 0 16px; font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin-top: 24px; color: #7dd3fc; }
    label { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 14px; }
    textarea { width: 100%; min-height: 120px; background: #171a21; color: #e6e6e6; border: 1px solid #3a4050; border-radius: 6px; padding: 8px; }
    button { background: #2a2f3a; color: #e6e6e6; border: 1px solid #3a4050; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .muted { color: #9aa0a6; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Privacy Shield — Advanced</h1>

  <h2>Filter lists</h2>
  <label><input type="checkbox" id="easylist" /> EasyList (ads)</label>
  <label><input type="checkbox" id="easyprivacy" /> EasyPrivacy (trackers)</label>

  <h2>Custom rules</h2>
  <p class="muted">One rule per line, e.g. <code>||ads.example.com^</code></p>
  <textarea id="customRules" placeholder="||ads.example.com^"></textarea>
  <button id="save">Save</button>
  <span id="saved" class="muted"></span>

  <script src="options.js"></script>
</body>
</html>
